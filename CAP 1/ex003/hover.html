<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de hover</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    div {
      display: inline-block;
    }

    div span { 
      display: inline;
    }

    div p {
      display: none;
      margin: 0;
    }

    div:hover span {
      display: none;
    }

    div:hover p {
      display: inline;
      color: red;
    }
  </style>
</head>
<body>
  <span>Exemplo de hover</span>
  <p>Passe o mouse sobre o texto abaixo:</p>

  <div>
    <h1>passe o mouse aqui</h1>
    <p>texto escondido</p>
  </div>

  <p>fim do exemplo</p>
</body>
</html>
